<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Konsolarium – PlayStation 2 (Play!)</title>
  <link rel="icon" href="../../icons/icon-cart-192.png">
  <link rel="stylesheet" href="ps2.css">
</head>
<body>
  <header id="bar">
    <div class="spacer"></div>
    <div id="title"><b>PlayStation 2</b><span id="status"></span></div>
    <span id="fps"></span>
    <button id="padtoggle" class="pb" aria-pressed="false" aria-label="Gamepad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="13.8" r="1" fill="currentColor"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas>
  </main>
  <div id="pad" hidden>
    <div class="shoulders left"><button data-code="Key2">L2</button><button data-code="Key1">L1</button></div>
    <div class="shoulders right"><button data-code="Key8">R1</button><button data-code="Key9">R2</button></div>
    <div class="dpad">
      <button class="up" data-code="ArrowUp">▲</button><button class="left" data-code="ArrowLeft">◀</button>
      <button class="right" data-code="ArrowRight">▶</button><button class="down" data-code="ArrowDown">▼</button>
    </div>
    <div class="face">
      <button class="tri" data-code="KeyS">△</button><button class="sq" data-code="KeyA">□</button>
      <button class="cir" data-code="KeyX">○</button><button class="ex" data-code="KeyZ">✕</button>
    </div>
    <div class="mid"><button data-code="Backspace">SELECT</button><button data-code="Enter">START</button></div>
    <div class="stick ls" data-neg-x="KeyF" data-pos-x="KeyH" data-neg-y="KeyT" data-pos-y="KeyG"><span class="nub"></span></div>
    <div class="stick rs" data-neg-x="KeyJ" data-pos-x="KeyL" data-neg-y="KeyI" data-pos-y="KeyK"><span class="nub"></span></div>
    <div class="clicks"><button data-code="Key3">L3</button><button data-code="Key0">R3</button></div>
  </div>
  <script src="../ks-bridge.js"></script>
  <script type="module" src="ps2.js"></script>
</body>
</html>
